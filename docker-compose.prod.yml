services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: sisaws
      POSTGRES_USER: sisaws
      POSTGRES_PASSWORD: sisaws123
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sisaws -d sisaws"]
      interval: 5s
      timeout: 3s
      retries: 15
    volumes:
      - sisaws_pgdata:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
    environment:
      SPRING_PROFILES_ACTIVE: postgres
      DB_URL: jdbc:postgresql://postgres:5432/sisaws
      DB_USERNAME: sisaws
      DB_PASSWORD: sisaws123
      SISAWS_CORS_ALLOWED_ORIGINS: http://localhost:8088
      SISAWS_JWT_SECRET: U2lzQVdTLWRvY2tlci1qd3Qtc2VjcmV0LWtleS0yMDI2LXNlZ3VyYS1sb2NhbA==
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8080:8080"

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:8080/api/v1
    depends_on:
      - backend
    ports:
      - "8088:80"

volumes:
  sisaws_pgdata:

spring:
  application:
    name: sisaws-api
  datasource:
    url: jdbc:h2:file:./data/sisaws;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;AUTO_SERVER=TRUE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  h2:
    console:
      enabled: true
      path: /h2-console
  servlet:
    multipart:
      max-file-size: 25MB
      max-request-size: 27MB

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info

sisaws:
  security:
    jwt:
      secret: ${SISAWS_JWT_SECRET:U2lzQVdTLWRldi1qd3Qtc2VjcmV0LWtleS0yMDI2LXNlZ3VyYS1sb2NhbA==}
      expiration-minutes: ${SISAWS_JWT_EXPIRATION_MINUTES:480}
    password-reset:
      ttl-minutes: ${SISAWS_PASSWORD_RESET_TTL_MINUTES:15}
      from-email: ${SISAWS_PASSWORD_RESET_FROM_EMAIL:}
      base-url: ${SISAWS_PASSWORD_RESET_BASE_URL:http://localhost:5173}
      aws-region: ${AWS_REGION:sa-east-1}
    library:
      bucket: ${SISAWS_STUDY_MATERIALS_BUCKET:}
      aws-region: ${AWS_REGION:sa-east-1}
      max-file-size-mb: ${SISAWS_STUDY_MATERIAL_MAX_FILE_MB:25}
    ai:
      enabled: ${SISAWS_BEDROCK_AI_ENABLED:false}
      bedrock-region: ${SISAWS_BEDROCK_REGION:us-east-1}
      model-id: ${SISAWS_BEDROCK_MODEL_ID:amazon.nova-lite-v1:0}
      embeddings-enabled: ${SISAWS_BEDROCK_EMBEDDINGS_ENABLED:false}
      embedding-model-id: ${SISAWS_BEDROCK_EMBEDDING_MODEL_ID:amazon.titan-embed-text-v2:0}
      embedding-dimensions: ${SISAWS_BEDROCK_EMBEDDING_DIMENSIONS:256}
    rate-limit:
      login-ip-limit: ${SISAWS_RATE_LIMIT_LOGIN_IP_LIMIT:10}
      login-email-limit: ${SISAWS_RATE_LIMIT_LOGIN_EMAIL_LIMIT:5}
      forgot-ip-limit: ${SISAWS_RATE_LIMIT_FORGOT_IP_LIMIT:5}
      forgot-email-limit: ${SISAWS_RATE_LIMIT_FORGOT_EMAIL_LIMIT:3}
      reset-ip-limit: ${SISAWS_RATE_LIMIT_RESET_IP_LIMIT:5}
      register-ip-limit: ${SISAWS_RATE_LIMIT_REGISTER_IP_LIMIT:5}
  instructor:
    emails: ${SISAWS_INSTRUCTOR_EMAILS:}
  cors:
    allowed-origins: ${SISAWS_CORS_ALLOWED_ORIGINS:http://localhost:5173}

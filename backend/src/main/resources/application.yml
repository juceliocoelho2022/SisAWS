spring:
  application:
    name: sisaws-api
  datasource:
    url: jdbc:h2:file:./data/sisaws;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;AUTO_SERVER=TRUE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  h2:
    console:
      enabled: true
      path: /h2-console

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info

sisaws:
  security:
    jwt:
      secret: ${SISAWS_JWT_SECRET:U2lzQVdTLWRldi1qd3Qtc2VjcmV0LWtleS0yMDI2LXNlZ3VyYS1sb2NhbA==}
      expiration-minutes: ${SISAWS_JWT_EXPIRATION_MINUTES:480}
    password-reset:
      ttl-minutes: ${SISAWS_PASSWORD_RESET_TTL_MINUTES:15}
      from-email: ${SISAWS_PASSWORD_RESET_FROM_EMAIL:}
      base-url: ${SISAWS_PASSWORD_RESET_BASE_URL:http://localhost:5173}
      aws-region: ${AWS_REGION:sa-east-1}
  cors:
    allowed-origins: ${SISAWS_CORS_ALLOWED_ORIGINS:http://localhost:5173}

name: SisAWS CI

on:
  workflow_dispatch:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

concurrency:
  group: sisaws-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect deploy changes
    runs-on: ubuntu-24.04
    outputs:
      backend: ${{ steps.detect.outputs.backend }}
      frontend: ${{ steps.detect.outputs.frontend }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Detect deploy changes
        id: detect
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            backend=true
            frontend=true
          elif [ "$EVENT_NAME" != "push" ]; then
            backend=false
            frontend=false
          elif [ "$BEFORE_SHA" = "0000000000000000000000000000000000000000" ]; then
            backend=true
            frontend=true
          else
            if git diff --quiet "$BEFORE_SHA" "$GITHUB_SHA" -- backend; then
              backend=false
            else
              backend=true
            fi

            if git diff --quiet "$BEFORE_SHA" "$GITHUB_SHA" -- frontend infra/terraform/frontend.tf infra/terraform/backend.tf; then
              frontend=false
            else
              frontend=true
            fi
          fi

          echo "backend=$backend" >> "$GITHUB_OUTPUT"
          echo "frontend=$frontend" >> "$GITHUB_OUTPUT"


  backend:
    name: Backend - Java 21
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Test and verify
        run: mvn -B clean verify

      - name: Build backend container
        run: docker build -t sisaws-api:ci .

      - name: Upload JaCoCo report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: jacoco-report
          path: backend/target/site/jacoco/
          if-no-files-found: ignore

  frontend:
    name: Frontend - React
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: TypeScript and production build
        run: npm run build

      - name: Build frontend container
        run: docker build --build-arg VITE_API_URL=/api/v1 -t sisaws-web:ci .

  infrastructure:
    name: Infrastructure - Terraform
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: infra/terraform

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "~1.13.0"

      - name: Terraform format
        run: terraform fmt -check -recursive

      - name: Terraform init
        run: terraform init -backend=false

      - name: Terraform validate
        run: terraform validate

  deploy-backend:
    name: Deploy backend - AWS ECS
    if: vars.SISAWS_AWS_DEPLOY_ENABLED == 'true' && needs.changes.outputs.backend == 'true' && (github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main'))
    needs: [changes, backend, frontend, infrastructure]
    runs-on: ubuntu-24.04

    permissions:
      contents: read
      id-token: write

    env:
      AWS_REGION: ${{ vars.SISAWS_AWS_REGION }}
      ECR_REPOSITORY: sisaws-dev-backend
      ECS_CLUSTER: sisaws-dev-cluster
      ECS_SERVICE: sisaws-dev-backend

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Configure AWS credentials with OIDC
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.SISAWS_AWS_DEPLOY_ROLE_ARN }}
          role-session-name: sisaws-github-actions
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push backend image
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: |
          IMAGE_URI="$REGISTRY/$ECR_REPOSITORY"
          docker build -t "$IMAGE_URI:${GITHUB_SHA}" -t "$IMAGE_URI:latest" ./backend
          docker push "$IMAGE_URI:${GITHUB_SHA}"
          docker push "$IMAGE_URI:latest"

      - name: Force ECS deployment
        run: |
          aws ecs update-service \
            --cluster "$ECS_CLUSTER" \
            --service "$ECS_SERVICE" \
            --force-new-deployment \
            --region "$AWS_REGION" \
            --no-cli-pager

      - name: Wait for ECS service stability
        run: |
          aws ecs wait services-stable \
            --cluster "$ECS_CLUSTER" \
            --services "$ECS_SERVICE" \
            --region "$AWS_REGION"

      - name: Show deployment status
        run: |
          aws ecs describe-services \
            --cluster "$ECS_CLUSTER" \
            --services "$ECS_SERVICE" \
            --region "$AWS_REGION" \
            --query "services[0].{Status:status,Desired:desiredCount,Running:runningCount,Pending:pendingCount}" \
            --output table

  deploy-frontend:
    name: Deploy frontend - AWS S3
    if: vars.SISAWS_AWS_DEPLOY_ENABLED == 'true' && needs.changes.outputs.frontend == 'true' && (github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main'))
    needs: [changes, backend, frontend, infrastructure]
    runs-on: ubuntu-24.04

    permissions:
      contents: read
      id-token: write

    env:
      AWS_REGION: ${{ vars.SISAWS_AWS_REGION }}
      ALB_NAME: sisaws-dev-api

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Configure AWS credentials with OIDC
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.SISAWS_AWS_DEPLOY_ROLE_ARN }}
          role-session-name: sisaws-github-frontend
          aws-region: ${{ env.AWS_REGION }}

      - name: Resolve AWS deployment endpoints
        id: aws
        shell: bash
        run: |
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          BUCKET="sisaws-dev-web-$ACCOUNT_ID"
          ALB_DNS=$(aws elbv2 describe-load-balancers \
            --names "$ALB_NAME" \
            --region "$AWS_REGION" \
            --query "LoadBalancers[0].DNSName" \
            --output text)

          echo "bucket=$BUCKET" >> "$GITHUB_OUTPUT"
          echo "api_url=http://$ALB_DNS/api/v1" >> "$GITHUB_OUTPUT"
          echo "frontend_url=http://$BUCKET.s3-website-$AWS_REGION.amazonaws.com" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build production frontend
        working-directory: frontend
        env:
          VITE_API_URL: ${{ steps.aws.outputs.api_url }}
        run: npm run build

      - name: Sync frontend to S3
        run: |
          aws s3 sync frontend/dist "s3://${{ steps.aws.outputs.bucket }}" \
            --delete \
            --region "$AWS_REGION"

      - name: Show frontend URL
        run: echo "Frontend deployed to ${{ steps.aws.outputs.frontend_url }}"


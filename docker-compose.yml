services:
  postgres:
    image: postgres:17-alpine
    container_name: sisaws-postgres
    environment:
      POSTGRES_DB: sisaws
      POSTGRES_USER: sisaws
      POSTGRES_PASSWORD: sisaws123
    ports:
      - "5432:5432"
    volumes:
      - sisaws_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sisaws -d sisaws"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  sisaws_pgdata:
